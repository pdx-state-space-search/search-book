<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 365" role="img" aria-labelledby="title desc"><title id="title">Alpha-beta skips a reply that cannot change MAX's choice</title><desc id="desc">MAX chooses North with value 3. North is a MIN node with leaves 3 and 5. South is a MIN node whose first leaf is 2. Since MAX already has 3, South cannot improve its choice, and South's second leaf 9 is pruned.</desc><rect width="800" height="365" fill="#fff"/><g stroke="#33475b" stroke-width="2"><path d="M400 70L220 130M400 70L580 130M220 178L130 250M220 178L310 250M580 178L490 250" fill="none"/><path d="M580 178L670 250" fill="none" stroke-dasharray="7 6"/><rect x="330" y="22" width="140" height="48" rx="10" fill="#cce6f5"/><rect x="150" y="130" width="140" height="48" rx="10" fill="#d8ecd0"/><rect x="510" y="130" width="140" height="48" rx="10" fill="#fbe2bd"/><rect x="95" y="250" width="70" height="48" rx="6" fill="#f5f8fa"/><rect x="275" y="250" width="70" height="48" rx="6" fill="#f5f8fa"/><rect x="455" y="250" width="70" height="48" rx="6" fill="#f5f8fa"/><rect x="635" y="250" width="70" height="48" rx="6" fill="#f5f8fa" stroke-dasharray="7 6"/></g><g font-family="sans-serif" font-size="22" fill="#17212b" text-anchor="middle"><text x="400" y="54">MAX: 3</text><text x="220" y="162">MIN: 3</text><text x="580" y="162">MIN: ≤2</text><text x="130" y="282">3</text><text x="310" y="282">5</text><text x="490" y="282">2</text><text x="670" y="282">9</text><text x="260" y="93">North</text><text x="540" y="93">South</text><text x="670" y="325">pruned</text><text x="360" y="352" font-size="18">All utilities are from MAX's perspective.</text></g></svg>