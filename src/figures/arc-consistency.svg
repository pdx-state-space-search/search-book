<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470" role="img" aria-labelledby="title desc"><title id="title">A two-color triangle</title><desc id="desc">Three variables X, Y, and Z form a triangle of inequality constraints. Each domain contains red and blue. Every value has support across each individual edge, but no complete two-color assignment satisfies the triangle.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#fff"/><g font-family="sans-serif" font-size="20" fill="#172033"><text x="440" y="36" text-anchor="middle" font-weight="bold">Arc consistency does not imply a solution</text><line x1="434" y1="131" x2="270" y2="277" stroke="#334155" stroke-width="2.3"  /><line x1="460" y1="131" x2="628" y2="277" stroke="#334155" stroke-width="2.3"  /><line x1="300" y1="302" x2="594" y2="302" stroke="#334155" stroke-width="2.3"  /><circle cx="447" cy="105" r="28" fill="#e0efff" stroke="#245d91" stroke-width="2.3"/><text x="447" y="112" text-anchor="middle">X</text><circle cx="244" cy="302" r="28" fill="#e0efff" stroke="#245d91" stroke-width="2.3"/><text x="244" y="309" text-anchor="middle">Y</text><circle cx="650" cy="302" r="28" fill="#e0efff" stroke="#245d91" stroke-width="2.3"/><text x="650" y="309" text-anchor="middle">Z</text><text x="555" y="112" text-anchor="middle">{red, blue}</text><text x="244" y="359" text-anchor="middle">{red, blue}</text><text x="650" y="359" text-anchor="middle">{red, blue}</text><text x="440" y="407" text-anchor="middle">Every edge requires different colors.</text><text x="440" y="440" text-anchor="middle" font-size="18">Each value has a neighbor support; the odd cycle is still impossible.</text></g></svg>