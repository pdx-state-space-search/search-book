<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 450" role="img" aria-labelledby="title desc"><title id="title">A feasible graph coloring</title><desc id="desc">Edges AB, AC, BC, and CD require different endpoint colors. A is red, B green, C blue, and D red. There is no edge AD.</desc><rect width="840" height="450" fill="white"/><g font-family="sans-serif" fill="#17212b"><text x="420" y="38" font-size="26" text-anchor="middle" font-weight="bold">Graph coloring</text><path d="M160 130L160 330" stroke="#33475b" stroke-width="3"/><path d="M160 130L440 230" stroke="#33475b" stroke-width="3"/><path d="M160 330L440 230" stroke="#33475b" stroke-width="3"/><path d="M440 230L700 230" stroke="#33475b" stroke-width="3"/><circle cx="160" cy="130" r="33" fill="#f6cbd0" stroke="#33475b" stroke-width="2"/><text x="160" y="138" font-size="26" text-anchor="middle" font-weight="normal">A</text><circle cx="160" cy="330" r="33" fill="#cee8d4" stroke="#33475b" stroke-width="2"/><text x="160" y="338" font-size="26" text-anchor="middle" font-weight="normal">B</text><circle cx="440" cy="230" r="33" fill="#cde3f5" stroke="#33475b" stroke-width="2"/><text x="440" y="238" font-size="26" text-anchor="middle" font-weight="normal">C</text><circle cx="700" cy="230" r="33" fill="#f6cbd0" stroke="#33475b" stroke-width="2"/><text x="700" y="238" font-size="26" text-anchor="middle" font-weight="normal">D</text><text x="110" y="137" font-size="22" text-anchor="end" font-weight="normal">red</text><text x="110" y="337" font-size="22" text-anchor="end" font-weight="normal">green</text><text x="440" y="175" font-size="22" text-anchor="middle" font-weight="normal">blue</text><text x="700" y="292" font-size="22" text-anchor="middle" font-weight="normal">red</text><text x="420" y="420" font-size="21" text-anchor="middle" font-weight="normal">Each edge requires different colors.</text></g></svg>
