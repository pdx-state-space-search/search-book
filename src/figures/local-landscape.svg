<svg xmlns="http://www.w3.org/2000/svg" width="880" height="450" viewBox="0 0 880 450" role="img" aria-labelledby="title desc"><title id="title">An illustrative local-search landscape</title><desc id="desc">Dots represent a finite sequence of states, with adjacency defining the neighborhood. A local minimum at the second dot requires an uphill move before reaching the lower global minimum at the fourth dot. This is a conceptual diagram, not measured data.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#fff"/><g font-family="sans-serif" font-size="20" fill="#172033"><text x="440" y="36" text-anchor="middle" font-weight="bold">A neighborhood determines what “local” means</text><line x1="80" y1="340" x2="810" y2="340" stroke="#334155" stroke-width="2.3" marker-end="url(#arrow)" /><line x1="80" y1="340" x2="80" y2="70" stroke="#334155" stroke-width="2.3" marker-end="url(#arrow)" /><text x="95" y="80" >Objective to minimize</text><text x="790" y="373" text-anchor="end">State order</text><polyline points="110,105 210,235 310,165 410,285 510,200 610,145 710,215 790,85" fill="none" stroke="#245d91" stroke-width="3"/><circle cx="110" cy="105" r="7" fill="#245d91"/><circle cx="210" cy="235" r="7" fill="#245d91"/><circle cx="310" cy="165" r="7" fill="#245d91"/><circle cx="410" cy="285" r="7" fill="#245d91"/><circle cx="510" cy="200" r="7" fill="#245d91"/><circle cx="610" cy="145" r="7" fill="#245d91"/><circle cx="710" cy="215" r="7" fill="#245d91"/><circle cx="790" cy="85" r="7" fill="#245d91"/><text x="210" y="270" text-anchor="middle" font-size="18">local minimum</text><text x="410" y="320" text-anchor="middle" font-size="18">global minimum</text><line x1="214" y1="226" x2="300" y2="172" stroke="#334155" stroke-width="2.3" marker-end="url(#arrow)" /><text x="245" y="181" text-anchor="middle" font-size="17">uphill</text><text x="440" y="420" text-anchor="middle" font-size="18">Only adjacent dots are neighbors in this illustrative finite space.</text></g></svg>