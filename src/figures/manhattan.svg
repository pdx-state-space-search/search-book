<svg xmlns="http://www.w3.org/2000/svg" width="880" height="360" viewBox="0 0 880 360" role="img" aria-labelledby="title desc"><title id="title">Manhattan distance on sliding tiles</title><desc id="desc">In the current three-by-three puzzle, tile 5 is one row below its goal and tile 8 one column to the right. All other numbered tiles are in place. Their Manhattan distances sum to two, excluding the blank.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#fff"/><g font-family="sans-serif" font-size="20" fill="#172033"><text x="245" y="37" text-anchor="middle" font-weight="bold">Current state</text><text x="635" y="37" text-anchor="middle" font-weight="bold">Goal state</text><rect x="140" y="65" width="70" height="70" fill="#e0efff" stroke="#334155" stroke-width="2"/><text x="175" y="109" text-anchor="middle" font-size="28">1</text><rect x="210" y="65" width="70" height="70" fill="#e0efff" stroke="#334155" stroke-width="2"/><text x="245" y="109" text-anchor="middle" font-size="28">2</text><rect x="280" y="65" width="70" height="70" fill="#e0efff" stroke="#334155" stroke-width="2"/><text x="315" y="109" text-anchor="middle" font-size="28">3</text><rect x="140" y="135" width="70" height="70" fill="#e0efff" stroke="#334155" stroke-width="2"/><text x="175" y="179" text-anchor="middle" font-size="28">4</text><rect x="210" y="135" width="70" height="70" fill="#f1f5f9" stroke="#334155" stroke-width="2"/><rect x="280" y="135" width="70" height="70" fill="#e0efff" stroke="#334155" stroke-width="2"/><text x="315" y="179" text-anchor="middle" font-size="28">6</text><rect x="140" y="205" width="70" height="70" fill="#e0efff" stroke="#334155" stroke-width="2"/><text x="175" y="249" text-anchor="middle" font-size="28">7</text><rect x="210" y="205" width="70" height="70" fill="#e0efff" stroke="#334155" stroke-width="2"/><text x="245" y="249" text-anchor="middle" font-size="28">5</text><rect x="280" y="205" width="70" height="70" fill="#e0efff" stroke="#334155" stroke-width="2"/><text x="315" y="249" text-anchor="middle" font-size="28">8</text><rect x="530" y="65" width="70" height="70" fill="#e0efff" stroke="#334155" stroke-width="2"/><text x="565" y="109" text-anchor="middle" font-size="28">1</text><rect x="600" y="65" width="70" height="70" fill="#e0efff" stroke="#334155" stroke-width="2"/><text x="635" y="109" text-anchor="middle" font-size="28">2</text><rect x="670" y="65" width="70" height="70" fill="#e0efff" stroke="#334155" stroke-width="2"/><text x="705" y="109" text-anchor="middle" font-size="28">3</text><rect x="530" y="135" width="70" height="70" fill="#e0efff" stroke="#334155" stroke-width="2"/><text x="565" y="179" text-anchor="middle" font-size="28">4</text><rect x="600" y="135" width="70" height="70" fill="#e0efff" stroke="#334155" stroke-width="2"/><text x="635" y="179" text-anchor="middle" font-size="28">5</text><rect x="670" y="135" width="70" height="70" fill="#e0efff" stroke="#334155" stroke-width="2"/><text x="705" y="179" text-anchor="middle" font-size="28">6</text><rect x="530" y="205" width="70" height="70" fill="#e0efff" stroke="#334155" stroke-width="2"/><text x="565" y="249" text-anchor="middle" font-size="28">7</text><rect x="600" y="205" width="70" height="70" fill="#e0efff" stroke="#334155" stroke-width="2"/><text x="635" y="249" text-anchor="middle" font-size="28">8</text><rect x="670" y="205" width="70" height="70" fill="#f1f5f9" stroke="#334155" stroke-width="2"/><line x1="370" y1="170" x2="500" y2="170" stroke="#334155" stroke-width="2.3" marker-end="url(#arrow)" /><text x="440" y="148" text-anchor="middle" font-size="18">goal</text><text x="440" y="324" text-anchor="middle">Tile 5: one step. Tile 8: one step. Manhattan estimate: 2.</text></g></svg>