<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 480" role="img" aria-labelledby="title desc"><title id="title">Two partitions and their objective values</title><desc id="desc">Weights 8, 5, 4 versus 7, 6 have sums 17 and 13, imbalance 4. Weights 6, 5, 4 versus 7, 8 have sums 15 and 15, imbalance zero.</desc><rect width="840" height="480" fill="white"/><g font-family="sans-serif" fill="#17212b"><text x="420" y="38" font-size="26" text-anchor="middle" font-weight="bold">Number partitioning</text><text x="420" y="75" font-size="22" text-anchor="middle" font-weight="normal">Candidate 1: imbalance 4</text><rect x="40" y="95" width="340" height="120" rx="10" fill="#f1f6fb" stroke="#33475b" stroke-width="2"/><text x="65" y="137" font-size="24" text-anchor="middle" font-weight="normal">A</text><rect x="110" y="110" width="62" height="42" rx="6" fill="#d5e7f4" stroke="#42647f"/><text x="141" y="139" font-size="24" text-anchor="middle" font-weight="normal">8</text><rect x="186" y="110" width="62" height="42" rx="6" fill="#d5e7f4" stroke="#42647f"/><text x="217" y="139" font-size="24" text-anchor="middle" font-weight="normal">5</text><rect x="262" y="110" width="62" height="42" rx="6" fill="#d5e7f4" stroke="#42647f"/><text x="293" y="139" font-size="24" text-anchor="middle" font-weight="normal">4</text><text x="210" y="193" font-size="22" text-anchor="middle" font-weight="normal">Sum = 17</text><rect x="460" y="95" width="340" height="120" rx="10" fill="#f1f6fb" stroke="#33475b" stroke-width="2"/><text x="485" y="137" font-size="24" text-anchor="middle" font-weight="normal">B</text><rect x="530" y="110" width="62" height="42" rx="6" fill="#d5e7f4" stroke="#42647f"/><text x="561" y="139" font-size="24" text-anchor="middle" font-weight="normal">7</text><rect x="606" y="110" width="62" height="42" rx="6" fill="#d5e7f4" stroke="#42647f"/><text x="637" y="139" font-size="24" text-anchor="middle" font-weight="normal">6</text><text x="630" y="193" font-size="22" text-anchor="middle" font-weight="normal">Sum = 13</text><text x="420" y="270" font-size="22" text-anchor="middle" font-weight="normal">Candidate 2: imbalance 0</text><rect x="40" y="290" width="340" height="120" rx="10" fill="#f1f6fb" stroke="#33475b" stroke-width="2"/><text x="65" y="332" font-size="24" text-anchor="middle" font-weight="normal">A</text><rect x="110" y="305" width="62" height="42" rx="6" fill="#d5e7f4" stroke="#42647f"/><text x="141" y="334" font-size="24" text-anchor="middle" font-weight="normal">6</text><rect x="186" y="305" width="62" height="42" rx="6" fill="#d5e7f4" stroke="#42647f"/><text x="217" y="334" font-size="24" text-anchor="middle" font-weight="normal">5</text><rect x="262" y="305" width="62" height="42" rx="6" fill="#d5e7f4" stroke="#42647f"/><text x="293" y="334" font-size="24" text-anchor="middle" font-weight="normal">4</text><text x="210" y="388" font-size="22" text-anchor="middle" font-weight="normal">Sum = 15</text><rect x="460" y="290" width="340" height="120" rx="10" fill="#f1f6fb" stroke="#33475b" stroke-width="2"/><text x="485" y="332" font-size="24" text-anchor="middle" font-weight="normal">B</text><rect x="530" y="305" width="62" height="42" rx="6" fill="#d5e7f4" stroke="#42647f"/><text x="561" y="334" font-size="24" text-anchor="middle" font-weight="normal">7</text><rect x="606" y="305" width="62" height="42" rx="6" fill="#d5e7f4" stroke="#42647f"/><text x="637" y="334" font-size="24" text-anchor="middle" font-weight="normal">8</text><text x="630" y="388" font-size="22" text-anchor="middle" font-weight="normal">Sum = 15</text><text x="420" y="455" font-size="20" text-anchor="middle" font-weight="normal">Each candidate uses every weight exactly once.</text></g></svg>
