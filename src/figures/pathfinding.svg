<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 440" role="img" aria-labelledby="title desc"><title id="title">Path cost and number of edges differ</title><desc id="desc">S has a directed edge to G costing 20. S to A and A to G each cost 1. The two-edge path costs 2 and is highlighted in green.</desc><rect width="840" height="440" fill="white"/><g font-family="sans-serif" fill="#17212b"><defs><marker id="gray-arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#596774"/></marker><marker id="green-arrow" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#28744c"/></marker></defs><text x="420" y="38" font-size="26" text-anchor="middle" font-weight="bold">Pathfinding</text><path d="M134 140L706 140" stroke="#596774" stroke-width="3" marker-end="url(#gray-arrow)"/><path d="M130 157L390 299" fill="none" stroke="#28744c" stroke-width="4" marker-end="url(#green-arrow)"/><path d="M450 299L710 157" fill="none" stroke="#28744c" stroke-width="4" marker-end="url(#green-arrow)"/><text x="420" y="115" font-size="24" text-anchor="middle" font-weight="normal">20</text><text x="240" y="240" font-size="24" text-anchor="middle" font-weight="normal">1</text><text x="600" y="240" font-size="24" text-anchor="middle" font-weight="normal">1</text><circle cx="100" cy="140" r="33" fill="#dceaf7" stroke="#33475b" stroke-width="2"/><text x="100" y="148" font-size="26" text-anchor="middle" font-weight="normal">S</text><circle cx="420" cy="315" r="33" fill="#dceaf7" stroke="#33475b" stroke-width="2"/><text x="420" y="323" font-size="26" text-anchor="middle" font-weight="normal">A</text><circle cx="740" cy="140" r="33" fill="#dceaf7" stroke="#33475b" stroke-width="2"/><text x="740" y="148" font-size="26" text-anchor="middle" font-weight="normal">G</text><text x="420" y="408" font-size="23" text-anchor="middle" font-weight="normal">S → G costs 20.  S → A → G costs 2.</text></g></svg>
