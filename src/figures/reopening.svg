<svg xmlns="http://www.w3.org/2000/svg" width="880" height="480" viewBox="0 0 880 480" role="img" aria-labelledby="title desc"><title id="title">A graph that requires A-star reopening</title><desc id="desc">Directed edges have costs S to A three, S to B one, B to A one, and A to G three. Heuristics at S,A,B,G are five, zero, four, zero. The heuristic is admissible but inconsistent. Greedy search chooses a cost-six path; A-star can find the cost-five path by reopening A.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#fff"/><g font-family="sans-serif" font-size="20" fill="#172033"><text x="440" y="38" text-anchor="middle" font-weight="bold">A cheap-looking route can be more expensive</text><line x1="130" y1="200" x2="420" y2="95" stroke="#334155" stroke-width="2.3" marker-end="url(#arrow)" /><line x1="130" y1="224" x2="395" y2="329" stroke="#334155" stroke-width="2.3" marker-end="url(#arrow)" /><line x1="450" y1="314" x2="450" y2="110" stroke="#334155" stroke-width="2.3" marker-end="url(#arrow)" /><line x1="480" y1="95" x2="750" y2="200" stroke="#334155" stroke-width="2.3" marker-end="url(#arrow)" /><circle cx="100" cy="212" r="28" fill="#e0efff" stroke="#245d91" stroke-width="2.3"/><text x="100" y="219" text-anchor="middle">S</text><circle cx="450" cy="82" r="28" fill="#e0efff" stroke="#245d91" stroke-width="2.3"/><text x="450" y="89" text-anchor="middle">A</text><circle cx="450" cy="342" r="28" fill="#e0efff" stroke="#245d91" stroke-width="2.3"/><text x="450" y="349" text-anchor="middle">B</text><circle cx="780" cy="212" r="28" fill="#e0efff" stroke="#245d91" stroke-width="2.3"/><text x="780" y="219" text-anchor="middle">G</text><text x="255" y="127" text-anchor="middle">3</text><text x="255" y="306" text-anchor="middle">1</text><text x="472" y="220" >1</text><text x="635" y="127" text-anchor="middle">3</text><text x="100" y="270" text-anchor="middle">h = 5</text><text x="555" y="86" text-anchor="middle">h = 0</text><text x="450" y="395" text-anchor="middle">h = 4</text><text x="780" y="270" text-anchor="middle">h = 0</text><text x="440" y="445" text-anchor="middle">S → A → G costs 6. S → B → A → G costs 5.</text></g></svg>