<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" role="img" aria-labelledby="title desc"><title id="title">A seven-unit schedule on two machines</title><desc id="desc">Machine 1 executes A for three units then C for four. Machine 2 executes B for two units then D for two, followed by three idle units. A precedes C and B precedes D.</desc><rect width="760" height="240" fill="#fff"/><g font-family="sans-serif" font-size="20" fill="#17212b"><text x="20" y="36" font-weight="bold">Precedence bound = achieved makespan = 7</text><text x="15" y="105">Machine 1</text><text x="15" y="165">Machine 2</text></g><g stroke="#59636c" stroke-width="1"><path d="M 150 55 V 185"/><text x="150" y="212" text-anchor="middle" stroke="none" fill="#17212b" font-family="sans-serif" font-size="18">0</text><path d="M 230 55 V 185"/><text x="230" y="212" text-anchor="middle" stroke="none" fill="#17212b" font-family="sans-serif" font-size="18">1</text><path d="M 310 55 V 185"/><text x="310" y="212" text-anchor="middle" stroke="none" fill="#17212b" font-family="sans-serif" font-size="18">2</text><path d="M 390 55 V 185"/><text x="390" y="212" text-anchor="middle" stroke="none" fill="#17212b" font-family="sans-serif" font-size="18">3</text><path d="M 470 55 V 185"/><text x="470" y="212" text-anchor="middle" stroke="none" fill="#17212b" font-family="sans-serif" font-size="18">4</text><path d="M 550 55 V 185"/><text x="550" y="212" text-anchor="middle" stroke="none" fill="#17212b" font-family="sans-serif" font-size="18">5</text><path d="M 630 55 V 185"/><text x="630" y="212" text-anchor="middle" stroke="none" fill="#17212b" font-family="sans-serif" font-size="18">6</text><path d="M 710 55 V 185"/><text x="710" y="212" text-anchor="middle" stroke="none" fill="#17212b" font-family="sans-serif" font-size="18">7</text></g><g stroke="#25384c" stroke-width="2"><rect x="150" y="75" width="240" height="42" fill="#cce6f5"/><rect x="390" y="75" width="320" height="42" fill="#d8ecd0"/><rect x="150" y="135" width="160" height="42" fill="#fbe2bd"/><rect x="310" y="135" width="160" height="42" fill="#e6d8f4"/></g><g fill="#17212b" font-family="sans-serif" font-size="20" text-anchor="middle"><text x="270" y="103">A (3)</text><text x="550" y="103">C (4)</text><text x="230" y="163">B (2)</text><text x="390" y="163">D (2)</text><text x="590" y="163">idle</text><text x="430" y="237">Time</text></g></svg>