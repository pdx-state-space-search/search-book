 <title id="growth-title">Reducing branching moves a fixed search budget to greater depth</title><desc id="growth-desc">Total nodes through depth d are (b^(d+1)-1)/(b-1). The four-child tree fits a million-node budget through depth 9, but exceeds it at depth 10. The two-child tree fits through depth 18, but exceeds the budget at depth 19. Both grow beyond the vertical plotting range. This is a mathematical illustration.</desc><metadata>
