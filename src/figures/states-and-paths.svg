<svg xmlns="http://www.w3.org/2000/svg" width="880" height="410" viewBox="0 0 880 410" role="img" aria-labelledby="title desc"><title id="title">States and paths</title><desc id="desc">A state graph has two routes from S to G through A and B. The corresponding search tree contains a distinct node for each of the two paths reaching the same goal state G.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#fff"/><g font-family="sans-serif" font-size="20" fill="#172033"><text x="210" y="38" text-anchor="middle" font-weight="bold">State graph</text><text x="650" y="38" text-anchor="middle" font-weight="bold">Paths represented by nodes</text><line x1="197" y1="108" x2="141" y2="177" stroke="#334155" stroke-width="2.3" marker-end="url(#arrow)" /><line x1="224" y1="108" x2="283" y2="177" stroke="#334155" stroke-width="2.3" marker-end="url(#arrow)" /><line x1="141" y1="223" x2="195" y2="291" stroke="#334155" stroke-width="2.3" marker-end="url(#arrow)" /><line x1="281" y1="223" x2="225" y2="291" stroke="#334155" stroke-width="2.3" marker-end="url(#arrow)" /><circle cx="210" cy="82" r="28" fill="#e0efff" stroke="#245d91" stroke-width="2.3"/><text x="210" y="89" text-anchor="middle">S</text><circle cx="120" cy="200" r="28" fill="#e0efff" stroke="#245d91" stroke-width="2.3"/><text x="120" y="207" text-anchor="middle">A</text><circle cx="300" cy="200" r="28" fill="#e0efff" stroke="#245d91" stroke-width="2.3"/><text x="300" y="207" text-anchor="middle">B</text><circle cx="210" cy="318" r="28" fill="#e0efff" stroke="#245d91" stroke-width="2.3"/><text x="210" y="325" text-anchor="middle">G</text><line x1="636" y1="108" x2="574" y2="177" stroke="#334155" stroke-width="2.3" marker-end="url(#arrow)" /><line x1="664" y1="108" x2="726" y2="177" stroke="#334155" stroke-width="2.3" marker-end="url(#arrow)" /><line x1="560" y1="228" x2="560" y2="289" stroke="#334155" stroke-width="2.3" marker-end="url(#arrow)" /><line x1="740" y1="228" x2="740" y2="289" stroke="#334155" stroke-width="2.3" marker-end="url(#arrow)" /><circle cx="650" cy="82" r="28" fill="#e0efff" stroke="#245d91" stroke-width="2.3"/><text x="650" y="89" text-anchor="middle">S</text><circle cx="560" cy="200" r="28" fill="#e0efff" stroke="#245d91" stroke-width="2.3"/><text x="560" y="207" text-anchor="middle">A</text><circle cx="740" cy="200" r="28" fill="#e0efff" stroke="#245d91" stroke-width="2.3"/><text x="740" y="207" text-anchor="middle">B</text><circle cx="560" cy="318" r="28" fill="#e0efff" stroke="#245d91" stroke-width="2.3"/><text x="560" y="325" text-anchor="middle">G</text><circle cx="740" cy="318" r="28" fill="#e0efff" stroke="#245d91" stroke-width="2.3"/><text x="740" y="325" text-anchor="middle">G</text><text x="210" y="380" text-anchor="middle">One state G</text><text x="650" y="380" text-anchor="middle">Two paths reaching G</text></g></svg>